<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Login</title>

<link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

<div class="container">

<div class="box">

<h1>Login</h1>

<form action="/user/login" method="post">

<label>Username</label>

<input
type="text"
name="username"
placeholder="Username"
required>

<label>Password</label>

<input
type="password"
name="password"
placeholder="Password"
required>

<button>

Log In

</button>

</form>

<div class="bottom">

Don't have an account?

<a href="/register">

Sign Up

</a>

</div>

</div>

</div>

</body>

</html>
