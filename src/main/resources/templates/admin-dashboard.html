<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Admin Dashboard</title>

<link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

<div class="container">

<div class="box" style="width:900px;">

<h1>Admin Feedback Dashboard</h1>

<div style="text-align:right; margin-bottom:20px;">

<a href="/admin/logout">

<button type="button" class="small-btn">

Logout

</button>

</a>

</div>

<table>

<thead>

<tr>

<th>ID</th>

<th>Feedback</th>

<th>Date</th>

<th>Actions</th>

</tr>

</thead>

<tbody>

<tr th:each="f : ${feedbackList}">

<td th:text="${f.id}"></td>

<td th:text="${f.feedback}"></td>

<td th:text="${f.date}"></td>

<td>

<a th:href="@{/admin/edit(id=${f.id})}">

<button type="button" class="small-btn">

View

</button>

</a>

<a th:href="@{/admin/edit(id=${f.id})}">

<button type="button" class="small-btn">

Edit

</button>

</a>

<a th:href="@{/admin/delete(id=${f.id})}"
onclick="return confirm('Are you sure you want to delete this feedback?');">

<button type="button" class="small-btn">

Delete

</button>

</a>

</td>

</tr>

</tbody>

</table>

</div>

</div>

</body>

</html>
